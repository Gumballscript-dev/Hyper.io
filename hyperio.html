<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>hyper.io - Multiplayer</title>
<!-- Importa a biblioteca de conexão em tempo real -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root { --accent:#4dff9e; --accent2:#7ef0c0; --gold:#ffd166; --danger:#ff6b6b; --card:#0e2a3d; --text:#c9ffe9; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#04101a; font-family: system-ui, sans-serif; touch-action:none; user-select:none; color:var(--text); }
  #gameCanvas { display:block; width:100vw; height:100vh; }
  .hidden { display:none !important; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background: radial-gradient(circle at 50% 30%, #163a52, #04101a 75%); pointer-events:auto; z-index:10; }
  .login-card { width:100%; max-width:360px; background:var(--card); border:2px solid var(--accent2); border-radius:22px; padding:22px; display:flex; flex-direction:column; gap:12px; }
  .login-card input { width:100%; padding:14px; border-radius:12px; border:2px solid #2a6d8b; background:#081824; color:var(--text); font-size:16px; outline:none; }
  .login-card button { padding:14px; border-radius:999px; border:none; background:linear-gradient(135deg, #9effd4, #27b67a); color:#042; font-size:16px; font-weight:900; cursor:pointer; }
  .play-btn { width:150px; height:150px; border-radius:50%; border:6px solid var(--accent2); background: radial-gradient(circle at 35% 30%, #9effd4, #27b67a 60%, #0a6b45); color:#042; font-size:27px; font-weight:900; cursor:pointer; margin-top:20px; }
  
  /* HUD */
  #hud { position:absolute; inset:0; pointer-events:none; z-index:20; }
  #leaderboard { position:absolute; top:16px; right:16px; background:#000a; padding:10px; border-radius:10px; font-size:12px; border:1px solid #fff3; min-width:150px; }
  #leaderboard h3 { margin:0 0 5px 0; color:var(--gold); font-size:14px; text-align:center; }
  #massHud { position:absolute; top:16px; left:16px; color:#fff; font-weight:900; font-size:18px; text-shadow:0 2px 5px #000; }
  
  #actions { position:absolute; left:16px; bottom:calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; pointer-events:auto; }
  .action-btn { width:70px; height:70px; border-radius:50%; border:3px solid var(--accent2); background: radial-gradient(circle at 35% 30%, #9effd4, #27b67a 60%, #0a6b45); color:#042; font-size:11px; font-weight:900; cursor:pointer; }
  .action-btn:active { transform:scale(0.9); }
  
  #joystick { position:absolute; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:130px; height:130px; border-radius:50%; border:3px solid #7ef0c0aa; background:#0e2a3daa; pointer-events:auto; touch-action:none; }
  #joyKnob { position:absolute; left:50%; top:50%; width:56px; height:56px; border-radius:50%; border:3px solid #baffdc; background: radial-gradient(circle at 35% 30%, #9effd4, #27b67a 60%, #0a6b45); transform:translate(-50%,-50%); pointer-events:none; }

  /* Chat UI */
  #chatBtn { position:absolute; right:16px; bottom:calc(160px + env(safe-area-inset-bottom)); width:50px; height:50px; border-radius:50%; background:#0e2a3d; border:2px solid #7ef0c0; color:#fff; font-size:22px; pointer-events:auto; z-index:20; display:flex; align-items:center; justify-content:center; }
  #chatBox { position:absolute; bottom:calc(220px + env(safe-area-inset-bottom)); right:16px; width:250px; background:#000d; border:2px solid #7ef0c0; border-radius:12px; padding:10px; display:none; flex-direction:column; gap:8px; z-index:25; pointer-events:auto; }
  #chatBox input { width:100%; padding:10px; border-radius:8px; border:none; background:#fff; color:#000; font-size:14px; }
  #chatBox button { padding:8px; border-radius:8px; border:none; background:#27b67a; color:#fff; font-weight:bold; }
  
  #chatLog { position:absolute; bottom:calc(20px + env(safe-area-inset-bottom)); left:16px; color:#fff; font-size:12px; font-weight:bold; text-shadow:0 1px 3px #000; display:flex; flex-direction:column; gap:2px; pointer-events:none; z-index:15; width:200px; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- MENU INICIAL -->
<div id="menuScreen" class="screen">
  <h1 style="color:#fff; font-size:42px; text-shadow:0 0 20px #27b67a; margin-bottom:10px;">hyper.io</h1>
  <div class="login-card">
    <input id="nameInput" type="text" placeholder="Seu nome de jogador" maxlength="12">
    <button id="playOnlineBtn">JOGAR ONLINE</button>
  </div>
  <div id="statusMsg" style="margin-top:15px; font-size:13px; color:var(--gold); text-align:center; font-weight:bold;"></div>
</div>

<!-- HUD DO JOGO -->
<div id="hud" class="hidden">
  <div id="massHud">Massa: <span id="massVal">0</span></div>
  <div id="leaderboard"><h3>🏆 TOP 10</h3><div id="lbList"></div></div>
  
  <div id="actions">
    <button id="splitBtn" class="action-btn">DIVIDIR</button>
    <button id="injectBtn" class="action-btn">INJETAR</button>
  </div>
  
  <div id="joystick"><div id="joyKnob"></div></div>
  
  <div id="chatBtn">💬</div>
  <div id="chatBox"><input id="chatInput" type="text" placeholder="Mensagem..." maxlength="30"><button id="sendChat">Enviar</button></div>
  <div id="chatLog"></div>
</div>

<script>
// ==========================================
// CONEXÃO COM O SERVIDOR (RENDER)
// ==========================================
const SERVER_URL = 'https://hyper-io-server.onrender.com'; 

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

let socket;
let myId = null;
let worldSize = 4000;
let players = {};
let foods = [];

let camera = { x: 0, y: 0, zoom: 1 };
let targetX = 0, targetY = 0;

// Controles
let joy = { active: false, x: 0, y: 0 };
let lastMoveDir = { x: 1, y: 0 };

function resize() { 
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight; 
  canvas.width = W * dpr; canvas.height = H * dpr; 
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr); 
}
window.addEventListener('resize', resize); resize();

// Botão de Jogar
document.getElementById('playOnlineBtn').onclick = () => {
  const name = document.getElementById('nameInput').value.trim() || "Jogador";
  const status = document.getElementById('statusMsg');
  
  status.textContent = "Conectando ao servidor... (Pode demorar até 50s se estiver dormindo)";
  document.getElementById('playOnlineBtn').style.opacity = '0.5';
  
  // Conecta ao servidor Render
  socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    status.textContent = "Conectado! Entrando...";
  });

  socket.on('init', (data) => {
    myId = data.myId;
    players = data.players;
    foods = data.foods;
    worldSize = data.worldSize;
    socket.emit('setName', name);
    
    if(players[myId]) { camera.x = players[myId].x; camera.y = players[myId].y; }
    
    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
  });

  // Eventos do servidor
  socket.on('newPlayer', (p) => players[p.id] = p);
  socket.on('playerMoved', (p) => { if(players[p.id]) { players[p.id].x = p.x; players[p.id].y = p.y; players[p.id].r = p.r; } });
  socket.on('playerDisconnected', (id) => delete players[id]);
  socket.on('updateName', (data) => { if(players[data.id]) players[data.id].name = data.name; });
  
  socket.on('playerEaten', (data) => { 
    if(players[data.eaterId]) players[data.eaterId].r = data.newRadius; 
    delete players[data.targetId]; 
  });

  socket.on('foodEaten', (foodId) => {
    const idx = foods.findIndex(f => f.id === foodId);
    if(idx !== -1) foods.splice(idx, 1);
  });
  
  socket.on('youWereEaten', () => {
    alert("Você foi comido! Voltando ao menu.");
    location.reload();
  });

  // Chat e Emotes
  socket.on('chatMessage', (data) => {
    addChatMsg(`${data.name}: ${data.msg}`);
  });
};

// Loop de Atualização do Jogo
function update() {
  if(!myId || !players[myId]) return;
  const me = players[myId];

  // Movimento
  let mdx = 0, mdy = 0;
  if(joy.active) { mdx = joy.x; mdy = joy.y; }
  if(mdx || mdy) { lastMoveDir = {x: mdx, y: mdy}; }
  
  const speed = Math.max(100, 300 - me.r*2);
  me.x += mdx * speed * 0.016; 
  me.y += mdy * speed * 0.016;
  me.x = Math.max(me.r, Math.min(worldSize-me.r, me.x));
  me.y = Math.max(me.r, Math.min(worldSize-me.r, me.y));

  // Avisa o servidor da nova posição
  socket.emit('updateState', { x: me.x, y: me.y, r: me.r });

  // Verifica se o player comeu outro jogador
  for(let id in players) {
    if(id === myId) continue;
    const other = players[id];
    const dist = Math.hypot(me.x - other.x, me.y - other.y);
    if(dist < me.r - other.r*0.5 && me.r > other.r * 1.1) {
      socket.emit('eatPlayer', id); // Avisa o servidor para transferir a massa
    }
  }

  // Verifica se o player comeu comida
  for(let i = foods.length - 1; i >= 0; i--) {
    const f = foods[i];
    const dist = Math.hypot(me.x - f.x, me.y - f.y);
    if(dist < me.r - f.r*0.5) {
      me.r = Math.sqrt(me.r*me.r + f.r*f.r*0.8);
      socket.emit('eatFood', f.id); // Avisa o servidor
    }
  }

  // Câmera segue o player
  targetX = me.x; targetY = me.y;
  camera.x += (targetX - camera.x) * 0.1;
  camera.y += (targetY - camera.y) * 0.1;
  
  let tZoom = Math.max(0.4, 1.2 - me.r*0.005);
  camera.zoom += (tZoom - camera.zoom) * 0.05;
  
  document.getElementById('massVal').textContent = Math.round(me.r);
}

// Renderização
function draw() {
  ctx.fillStyle = '#071624'; ctx.fillRect(0,0,W,H);
  if(!myId || !players[myId]) return;

  ctx.save();
  ctx.translate(W/2, H/2); ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x, -camera.y);

  // Desenha Comida
  foods.forEach(f => { ctx.beginPath(); ctx.fillStyle = f.color; ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill(); });

  // Desenha Jogadores
  for(let id in players) {
    const p = players[id];
    ctx.beginPath(); ctx.fillStyle = p.color; ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = id === myId ? '#fff' : '#0004'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.name, p.x, p.y - p.r - 10);
  }

  ctx.restore();
}

// Atualiza Placar Global em tempo real
setInterval(() => {
  if(!myId) return;
  const lb = document.getElementById('lbList');
  const arr = Object.values(players).sort((a,b) => b.r - a.r).slice(0, 10);
  lb.innerHTML = arr.map((p, i) => `<div style="color:${p.id===myId?'#4dff9e':'#fff'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${i+1}. ${p.name} - ${Math.round(p.r)}</div>`).join('');
}, 1000);

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();

// ==========================================
// CONTROLES E UI
// ==========================================
document.getElementById('splitBtn').onclick = () => {
  if(players[myId] && players[myId].r > 30) {
    players[myId].r /= 1.4; // Simulação local rápida
    socket.emit('updateState', { x: players[myId].x, y: players[myId].y, r: players[myId].r });
  }
};

// Analógico
const joyEl = document.getElementById('joystick'), joyKnob = document.getElementById('joyKnob');
joyEl.addEventListener('pointerdown', e => { joy.active = true; joyEl.setPointerCapture(e.pointerId); moveJoy(e.clientX, e.clientY); });
joyEl.addEventListener('pointermove', e => { if(joy.active) moveJoy(e.clientX, e.clientY); });
joyEl.addEventListener('pointerup', () => { joy.active = false; joy.x = 0; joy.y = 0; joyKnob.style.transform = 'translate(-50%,-50%)'; });
function moveJoy(cx, cy) {
  const rect = joyEl.getBoundingClientRect();
  let dx = cx - (rect.left + rect.width/2), dy = cy - (rect.top + rect.height/2);
  const max = rect.width/2, l = Math.hypot(dx,dy);
  if(l > max) { dx = dx/l*max; dy = dy/l*max; }
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joy.x = dx/max; joy.y = dy/max;
}

// Chat
const chatBox = document.getElementById('chatBox');
document.getElementById('chatBtn').onclick = () => { chatBox.style.display = chatBox.style.display === 'flex' ? 'none' : 'flex'; };
document.getElementById('sendChat').onclick = () => {
  const msg = document.getElementById('chatInput').value.trim();
  if(msg && socket) { 
    socket.emit('chatMessage', msg); 
    document.getElementById('chatInput').value = ''; 
    chatBox.style.display = 'none'; 
  }
};
function addChatMsg(txt) {
  const log = document.getElementById('chatLog');
  const el = document.createElement('div'); 
  el.textContent = txt; 
  log.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}
</script>
</body>
</html>
