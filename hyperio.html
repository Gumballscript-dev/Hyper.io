<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>hyper.io - Evolução</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root { --accent:#4dff9e; --gold:#ffd166; --danger:#ff6b6b; --card:#0e2a3d; --text:#c9ffe9; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#04101a; font-family: system-ui, sans-serif; touch-action:none; user-select:none; color:var(--text); }
  #gameCanvas { display:block; width:100vw; height:100vh; }
  .hidden { display:none !important; }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; background: radial-gradient(circle at 50% 30%, #163a52, #04101a 75%); pointer-events:auto; overflow-y:auto; padding:18px 0 80px; }
  
  .currency-bar { position:absolute; top:calc(16px + env(safe-area-inset-top)); left:16px; display:flex; gap:10px; z-index:5; font-weight:900; font-size:18px; background: #0008; padding: 5px 15px; border-radius: 20px;}
  .coin { color:var(--gold); } .gem { color:#c77dff; }

  .title { color:var(--text); font-size:42px; font-weight:900; text-align:center; line-height:1; text-shadow:0 0 25px #27b67a; margin:10px 0; }
  .play-btn { width:140px; height:140px; border-radius:50%; border:6px solid #fff; background: radial-gradient(circle at 35% 30%, #9effd4, #27b67a 60%, #0a6b45); color:#042; font-size:27px; font-weight:900; cursor:pointer; margin-top:12px; display:flex; align-items:center; justify-content:center;}

  .float-btn { position:absolute; padding:10px 16px; border-radius:14px; font-size:13px; font-weight:900; cursor:pointer; border:2px solid; z-index:20; }
  #upgradesBtn { top:calc(70px + env(safe-area-inset-top)); left:16px; border-color:var(--gold); background:#1b3b52ee; color:var(--gold); }
  #battlepassBtn { top:calc(70px + env(safe-area-inset-top)); right:16px; border-color:#c77dff; background:#2a1640ee; color:#d9b8ff; }
  #settingsBtn { position:absolute; bottom:20px; right:20px; border-color:#7ef0c0; background:#0e2a3dee; color:#fff; }

  .mode-selector { display:flex; align-items:center; justify-content:center; gap:20px; margin-top:20px; }
  .arrow-btn { background:none; border:none; color:var(--danger); font-size:40px; cursor:pointer; }
  .mode-name { color:var(--danger); font-size:24px; font-weight:900; width:150px; text-align:center; text-transform:uppercase; }

  #actions { position:absolute; left:20px; bottom:calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:15px; pointer-events:none; z-index:20; }
  .circle-btn { width:70px; height:70px; border-radius:50%; border:3px solid #fff; background: radial-gradient(circle at 35% 30%, #333, #111); color:#fff; font-size:30px; display:flex; align-items:center; justify-content:center; pointer-events:auto; cursor:pointer; }
  #splitBtn { border-color:#ff6b6b; } #potionBtn { border-color:#4dff9e; }

  #joystick { position:absolute; right:20px; bottom:calc(20px + env(safe-area-inset-bottom)); width:130px; height:130px; border-radius:50%; border:3px solid #ffffff55; background:#ffffff11; pointer-events:auto; z-index:20; touch-action:none; }
  #joyKnob { position:absolute; left:50%; top:50%; width:60px; height:60px; border-radius:50%; border:2px solid #fff; background:#ffffffcc; transform:translate(-50%,-50%); pointer-events:none; }

  #hud { position:absolute; inset:0; pointer-events:none; z-index:20; }
  #massHud { position:absolute; top:16px; left:16px; background:#000a; padding:8px 15px; border-radius:10px; color:#fff; font-weight:900; border:1px solid #fff3; }
  #leaderboard { position:absolute; top:16px; right:16px; background:#000a; padding:10px; border-radius:10px; font-size:12px; border:1px solid #fff3; min-width:150px; }

  .login-card { width:100%; max-width:360px; background:var(--card); border:2px solid #7ef0c0; border-radius:22px; padding:22px; display:flex; flex-direction:column; gap:12px; z-index:30; }
  .login-card input { width:100%; padding:14px; border-radius:12px; border:2px solid #2a6d8b; background:#081824; color:var(--text); font-size:16px; outline:none; }
  .login-card button { padding:14px; border-radius:999px; border:none; background:linear-gradient(135deg, #9effd4, #27b67a); color:#042; font-size:16px; font-weight:900; cursor:pointer; }
  .back-btn { margin-top:16px; padding:12px 30px; border-radius:999px; border:2px solid #7ef0c0; background:transparent; color:var(--text); font-weight:800; pointer-events:auto; z-index:30; }

  .category-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; padding:0 20px; width:100%; max-width:520px; }
  .category-card { background:var(--card); border:2px solid #2a6d8b; border-radius:18px; padding:15px; text-align:center; font-weight:bold; font-size:18px; cursor:pointer; pointer-events:auto; }
  .skin-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:0 20px; width:100%; max-width:520px; }
  .skin-card { background:var(--card); border:2px solid #2a6d8b; border-radius:14px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; pointer-events:auto; }
  .skin-img { width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid #fff; }
  
  .xp-bar-container { position:absolute; bottom:0; left:0; width:100%; height:40px; background:#000a; border-top:2px solid #333; display:flex; align-items:center; justify-content:center; }
  .xp-bar-fill { position:absolute; left:0; top:0; height:100%; background:linear-gradient(90deg, #ff6b6b, #ff8fab); width:0%; z-index:1; transition:width 0.3s; }
  .xp-text { position:relative; z-index:2; font-weight:900; font-size:14px; color:#fff; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="ui">
  <!-- LOGIN -->
  <div id="authScreen" class="screen">
    <div class="title">hyper.io<br><small>Evolução</small></div>
    <div class="login-card" id="loginCard">
      <h2 style="text-align:center; margin:0 0 10px; color:#c9ffe9;">Entrar</h2>
      <input id="logName" type="text" placeholder="Nome" maxlength="16">
      <input id="logPass" type="password" placeholder="Senha" maxlength="32">
      <div id="logError" style="color:red; font-size:12px; text-align:center;"></div>
      <button id="loginBtn">Entrar</button>
      <div style="text-align:center; font-size:13px; margin-top:10px;">Não tem conta? <b id="toRegister" style="color:var(--gold); cursor:pointer;">Cadastre-se</b></div>
    </div>
    <div class="login-card hidden" id="registerCard">
      <h2 style="text-align:center; margin:0 0 10px; color:#c9ffe9;">Criar Conta</h2>
      <input id="regName" type="text" placeholder="Nome" maxlength="16">
      <input id="regPass" type="password" placeholder="Senha" maxlength="32">
      <input id="regPass2" type="password" placeholder="Confirmar Senha" maxlength="32">
      <div id="regError" style="color:red; font-size:12px; text-align:center;"></div>
      <button id="registerBtn">Criar Conta</button>
      <div style="text-align:center; font-size:13px; margin-top:10px;">Já tem conta? <b id="toLogin" style="color:var(--gold); cursor:pointer;">Fazer Login</b></div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="screen hidden">
    <div class="currency-bar">
      <span class="coin">🪙 <span id="coinLobby">0</span></span>
      <span class="gem">💎 <span id="gemLobby">0</span></span>
    </div>
    <button id="upgradesBtn" class="float-btn">🛒 LOJA</button>
    <button id="battlepassBtn" class="float-btn">👑 BATTLE PASS</button>

    <div class="title" style="margin-top:100px;">hyper.io<br><small id="welcomeName">célula</small></div>
    
    <div class="mode-selector">
      <button class="arrow-btn" id="prevMode">◀</button>
      <div class="mode-name" id="currentMode">SOLO</div>
      <button class="arrow-btn" id="nextMode">▶</button>
    </div>

    <button id="playBtn" class="play-btn" style="margin-top:20px;">▶</button>
    
    <button id="settingsBtn" class="float-btn">⚙️</button>

    <div class="xp-bar-container">
      <div class="xp-bar-fill" id="xpBarFill"></div>
      <div class="xp-text">XP <span id="xpText">0 / 100</span></div>
    </div>
  </div>

  <!-- LOJA -->
  <div id="shopScreen" class="screen hidden">
    <div class="title" style="font-size:24px;">Loja</div>
    <div id="categoryView" class="category-grid">
      <div class="category-card" onclick="openCategory('natal')">🎄 Natal</div>
      <div class="category-card" onclick="openCategory('comida')">🍔 Comida</div>
      <div class="category-card" onclick="openCategory('animais')">🐶 Animais</div>
      <div class="category-card" onclick="openCategory('logos')">💻 Logos</div>
    </div>
    <div id="skinView" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center;">
      <h3 id="catTitle" style="color:var(--gold); margin-bottom:10px;">Skins</h3>
      <div id="skinList" class="skin-grid"></div>
      <button class="back-btn" onclick="document.getElementById('skinView').classList.add('hidden'); document.getElementById('categoryView').classList.remove('hidden');">VOLTAR</button>
    </div>
    <button class="back-btn" onclick="showScreen('lobby')" style="margin-top:20px;">VOLTAR AO LOBBY</button>
  </div>

  <!-- BATTLE PASS -->
  <div id="battlepassScreen" class="screen hidden">
    <div class="title" style="font-size:24px;">Battle Pass</div>
    <div style="width:100%; max-width:400px; background:var(--card); padding:20px; border-radius:20px; text-align:center;">
      <p>Nível: <b id="bpLevel" style="color:var(--gold); font-size:24px;">1</b></p>
      <div style="background:#000a; height:20px; border-radius:10px; margin:10px 0; overflow:hidden;"><div id="xpBar" style="height:100%; width:0%; background:var(--gold);"></div></div>
      <p>XP: <span id="xpTextBP">0 / 100</span></p>
    </div>
    <button class="back-btn" onclick="showScreen('lobby')">VOLTAR</button>
  </div>

  <!-- CONFIGURAÇÕES -->
  <div id="settingsScreen" class="screen hidden">
    <div class="title" style="font-size:24px;">Configurações</div>
    <div class="login-card">
      <div style="text-align:center; margin-top:10px; font-size:12px; color:#8fb8cc;">Game by: miranhaX<br>Discord: miranhaX_00</div>
      <button id="logoutBtn" style="background:#ff6b6b; color:#fff; margin-top:20px;">SAIR DA CONTA</button>
    </div>
    <button class="back-btn" onclick="showScreen('lobby')">VOLTAR</button>
  </div>

  <!-- HUD DO JOGO -->
  <div id="hud" class="hidden">
    <div id="massHud">MASSA: <span id="massVal">0</span></div>
    <div id="leaderboard"><h3>🏆 TOP 10</h3><div id="lbList"></div></div>
    <div id="actions">
      <button id="splitBtn" class="circle-btn">⚙️</button>
      <button id="potionBtn" class="circle-btn">🧪</button>
    </div>
    <div id="joystick"><div id="joyKnob"></div></div>
  </div>
  
  <div id="bannerSlot"></div>
</div>

<script>
const SERVER_URL = 'https://hyper-io-server.onrender.com';
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, socket, myId = null, worldSize = 5000;
let players = {}, foods = [], viruses = [];
let camera = { x: 0, y: 0, zoom: 1 };
let joy = { active: false, x: 0, y: 0 };
let lastTime = 0;
let currentAccount = null;
let customImage = null;

let myCells = [];
let myMass = 20;
let canSplit = 0;
let isPlaying = false;
const MODES = ["SOLO", "CRAZY", "TIME"];

let save = { coins: 0, gems: 0, xp: 0, bpLevel: 1, ownedSkins: [], equippedSkin: 'none', customSkin: null };

const SKINS_DB = {
  natal: [
    { id: 'santa', name: 'Papai Noel', price: 500, img: 'https://cdn-icons-png.flaticon.com/512/791/791500.png' },
    { id: 'tree', name: 'Pinheiro', price: 300, img: 'https://cdn-icons-png.flaticon.com/512/861/861528.png' },
    { id: 'gift', name: 'Presente', price: 400, img: 'https://cdn-icons-png.flaticon.com/512/4213/4213268.png' },
    { id: 'snow', name: 'Boneco', price: 450, img: 'https://cdn-icons-png.flaticon.com/512/789/789422.png' },
    { id: 'star', name: 'Estrela', price: 200, img: 'https://cdn-icons-png.flaticon.com/512/616/616490.png' },
    { id: 'candy', name: 'Bengala', price: 250, img: 'https://cdn-icons-png.flaticon.com/512/2590/2590517.png' }
  ],
  comida: [
    { id: 'burger', name: 'Hambúrguer', price: 500, img: 'https://cdn-icons-png.flaticon.com/512/3075/3075977.png' },
    { id: 'pizza', name: 'Pizza', price: 500, img: 'https://cdn-icons-png.flaticon.com/512/1404/1404945.png' }
  ],
  animais: [
    { id: 'dog', name: 'Cachorro', price: 800, img: 'https://cdn-icons-png.flaticon.com/512/616/616408.png' },
    { id: 'cat', name: 'Gato', price: 800, img: 'https://cdn-icons-png.flaticon.com/512/616/616430.png' }
  ],
  logos: [
    { id: 'yt', name: 'YouTube', price: 1000, img: 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png' },
    { id: 'mc', name: 'Minecraft', price: 1200, img: 'https://cdn-icons-png.flaticon.com/512/8714/8714862.png' }
  ]
};

function getAccounts() { try { return JSON.parse(localStorage.getItem('mitosis_accounts') || '{}'); } catch(e) { return {}; } }
function setAccounts(a) { localStorage.setItem('mitosis_accounts', JSON.stringify(a)); }
function saveFor(n) { try { return JSON.parse(localStorage.getItem('mitosis_save_'+n) || 'null'); } catch(e) { return null; } }
function setSaveFor(n, o) { localStorage.setItem('mitosis_save_'+n, JSON.stringify(o)); }
async function hashPass(p) { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''); }
function persist() { if (currentAccount) setSaveFor(currentAccount, save); updateUI(); }

function updateUI() {
  if(document.getElementById('coinLobby')) document.getElementById('coinLobby').textContent = save.coins;
  if(document.getElementById('gemLobby')) document.getElementById('gemLobby').textContent = save.gems;
  if(document.getElementById('bpLevel')) document.getElementById('bpLevel').textContent = save.bpLevel;
  if(document.getElementById('xpText')) document.getElementById('xpText').textContent = save.xp + ' / 100';
  if(document.getElementById('xpTextBP')) document.getElementById('xpTextBP').textContent = save.xp + ' / 100';
  if(document.getElementById('xpBarFill')) document.getElementById('xpBarFill').style.width = save.xp + '%';
  if(document.getElementById('xpBar')) document.getElementById('xpBar').style.width = save.xp + '%';
}

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function loginAs(name) {
  currentAccount = name;
  save = Object.assign({coins:0, gems:0, xp:0, bpLevel:1, ownedSkins:[], equippedSkin:'none', customSkin:null}, saveFor(name) || {});
  if(save.customSkin) { const img = new Image(); img.onload = () => customImage = img; img.src = save.customSkin; }
  document.getElementById('welcomeName').textContent = name;
  updateUI(); showScreen('lobby');
}
document.getElementById('toRegister').onclick = () => { document.getElementById('loginCard').classList.add('hidden'); document.getElementById('registerCard').classList.remove('hidden'); };
document.getElementById('toLogin').onclick = () => { document.getElementById('registerCard').classList.add('hidden'); document.getElementById('loginCard').classList.remove('hidden'); };
document.getElementById('loginBtn').onclick = async () => {
  const n = document.getElementById('logName').value.trim(), p = document.getElementById('logPass').value;
  const accs = getAccounts(); if(!accs[n.toLowerCase()]) return document.getElementById('logError').textContent = 'Conta não encontrada.';
  if(accs[n.toLowerCase()].hash !== await hashPass(p)) return document.getElementById('logError').textContent = 'Senha incorreta.';
  loginAs(n);
};
document.getElementById('registerBtn').onclick = async () => {
  const n = document.getElementById('regName').value.trim(), p1 = document.getElementById('regPass').value, p2 = document.getElementById('regPass2').value;
  const accs = getAccounts(); if(n.length < 2) return document.getElementById('regError').textContent = 'Nome curto.';
  if(p1.length < 4) return document.getElementById('regError').textContent = 'Senha curta.';
  if(p1 !== p2) return document.getElementById('regError').textContent = 'Senhas diferentes.';
  if(accs[n.toLowerCase()]) return document.getElementById('regError').textContent = 'Nome já existe.';
  accs[n.toLowerCase()] = { name: n, hash: await hashPass(p1) }; setAccounts(accs); loginAs(n);
};
document.getElementById('upgradesBtn').onclick = () => showScreen('shopScreen');
document.getElementById('battlepassBtn').onclick = () => showScreen('battlepassScreen');
document.getElementById('settingsBtn').onclick = () => showScreen('settingsScreen');
document.getElementById('logoutBtn').onclick = () => { currentAccount = null; showScreen('auth'); };

let modeIdx = 0;
document.getElementById('prevMode').onclick = () => { modeIdx = (modeIdx - 1 + MODES.length) % MODES.length; document.getElementById('currentMode').textContent = MODES[modeIdx]; };
document.getElementById('nextMode').onclick = () => { modeIdx = (modeIdx + 1) % MODES.length; document.getElementById('currentMode').textContent = MODES[modeIdx]; };

window.openCategory = function(cat) {
  document.getElementById('categoryView').classList.add('hidden');
  document.getElementById('skinView').classList.remove('hidden');
  document.getElementById('catTitle').textContent = cat.toUpperCase();
  const list = document.getElementById('skinList'); list.innerHTML = '';
  SKINS_DB[cat].forEach(skin => {
    const owned = save.ownedSkins.includes(skin.id);
    const div = document.createElement('div'); div.className = 'skin-card';
    div.innerHTML = `<img src="${skin.img}" class="skin-img"><div style="font-size:11px; text-align:center;">${skin.name}</div>`;
    if(owned) {
      div.innerHTML += `<div style="color:#4dff9e; font-weight:bold; font-size:12px;">Equipar</div>`;
      div.onclick = () => { save.equippedSkin = skin.id; save.customSkin = skin.img; persist(); alert('Equipado!'); };
    } else {
      div.innerHTML += `<div style="color:var(--gold); font-weight:bold; font-size:12px;">🪙 ${skin.price}</div>`;
      div.onclick = () => {
        if(save.coins >= skin.price) { save.coins -= skin.price; save.ownedSkins.push(skin.id); persist(); openCategory(cat); alert('Comprado!'); }
        else alert('Moedas insuficientes!');
      };
    }
    list.appendChild(div);
  });
}

// ==========================================
// LÓGICA DO JOGO
// ==========================================
document.getElementById('playBtn').onclick = () => {
  showScreen('hud');
  myMass = 20; myCells = [{x: 2500, y: 2500, r: 20}]; canSplit = 4; isPlaying = true;
  
  foods = []; for(let i=0; i<500; i++) foods.push({x: Math.random()*worldSize, y: Math.random()*worldSize, r: 5, color: `hsl(${Math.random()*360}, 80%, 60%)`});
  viruses = []; for(let i=0; i<20; i++) viruses.push({x: Math.random()*worldSize, y: Math.random()*worldSize, r: 25});
  
  socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
  socket.on('init', (data) => { myId = data.myId; players = data.players; socket.emit('setName', currentAccount); });
  socket.on('playerMoved', (p) => { if(players[p.id]) { players[p.id].x = p.x; players[p.id].y = p.y; players[p.id].r = p.r; } });
  socket.on('playerDisconnected', (id) => delete players[id]);
  socket.on('newPlayer', (p) => players[p.id] = p);
  
  // Ganhar XP ao jogar
  setInterval(() => { if(isPlaying) { save.xp += 2; if(save.xp >= 100) { save.xp -= 100; save.bpLevel++; save.coins += 100; } persist(); } }, 3000);
};

function doSplit() {
  if(canSplit <= 0 || myCells.length >= 16) return;
  const newCells = [];
  myCells.forEach(cell => {
    if(cell.r > 30) {
      const newR = cell.r / Math.SQRT2; cell.r = newR;
      newCells.push({ x: cell.x, y: cell.y, r: newR });
    }
  });
  myCells = myCells.concat(newCells); canSplit--;
}

function update(dt) {
  if(!isPlaying) return;
  let mdx = 0, mdy = 0;
  if(joy.active) { mdx = joy.x; mdy = joy.y; }

  let totalMass = 0;
  myCells.forEach(cell => {
    const speed = Math.max(2, 8 - Math.log2(cell.r) * 0.5);
    cell.x += mdx * speed * dt * 60; cell.y += mdy * speed * dt * 60;
    cell.x = Math.max(cell.r, Math.min(worldSize-cell.r, cell.x));
    cell.y = Math.max(cell.r, Math.min(worldSize-cell.r, cell.y));
    totalMass += (cell.r * cell.r) / 10;
  });
  myMass = totalMass;

  for(let i=0; i<myCells.length; i++) {
    for(let j=i+1; j<myCells.length; j++) {
      let c1 = myCells[i], c2 = myCells[j];
      let d = Math.hypot(c1.x-c2.x, c1.y-c2.y);
      if(d < c1.r + c2.r) {
        let angle = Math.atan2(c2.y-c1.y, c2.x-c1.x);
        c1.x -= Math.cos(angle)*1.5; c1.y -= Math.sin(angle)*1.5;
        c2.x += Math.cos(angle)*1.5; c2.y += Math.sin(angle)*1.5;
      }
    }
  }

  for(let i=foods.length-1; i>=0; i--) {
    let f = foods[i];
    myCells.forEach(c => {
      if(Math.hypot(c.x-f.x, c.y-f.y) < c.r - f.r*0.5) {
        c.r = Math.sqrt(c.r*c.r + 4);
        foods.splice(i,1); foods.push({x: Math.random()*worldSize, y: Math.random()*worldSize, r: 5, color: `hsl(${Math.random()*360}, 80%, 60%)`});
      }
    });
  }

  for(let i=viruses.length-1; i>=0; i--) {
    let v = viruses[i];
    myCells.forEach((c) => {
      if(c.r > v.r && Math.hypot(c.x-v.x, c.y-v.y) < c.r) {
        for(let k=0; k<5; k++) myCells.push({ x: c.x + Math.random()*40-20, y: c.y + Math.random()*40-20, r: c.r*0.4 });
        c.r = c.r*0.4; viruses.splice(i,1); viruses.push({x: Math.random()*worldSize, y: Math.random()*worldSize, r: 25});
      }
    });
  }

  let mainC = myCells[0];
  if(mainC) {
    camera.x += (mainC.x - camera.x) * 0.1; camera.y += (mainC.y - camera.y) * 0.1;
    camera.zoom += (Math.max(0.4, 1.2 - mainC.r*0.005) - camera.zoom) * 0.1;
    document.getElementById('massVal').textContent = Math.round(myMass);
  }
}

function draw() {
  ctx.fillStyle = '#0d1c21'; ctx.fillRect(0,0,W,H);
  if(!isPlaying || !myCells[0]) return;
  ctx.save(); ctx.translate(W/2, H/2); ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x, -camera.y);

  foods.forEach(f => { ctx.beginPath(); ctx.fillStyle = f.color; ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill(); });
  viruses.forEach(v => {
    ctx.beginPath(); ctx.fillStyle = '#4dff9e'; 
    for(let i=0; i<12; i++) { let a = (i/12)*Math.PI*2; let rDist = v.r + (i%2===0 ? 8 : 0); ctx.lineTo(v.x + Math.cos(a)*rDist, v.y + Math.sin(a)*rDist); }
    ctx.closePath(); ctx.fill();
  });
  
  for(let id in players) {
    if(id === myId) continue; const p = players[id];
    ctx.beginPath(); ctx.fillStyle = p.color; ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.name, p.x, p.y - p.r - 10);
  }

  myCells.forEach((c, i) => {
    ctx.beginPath(); ctx.fillStyle = '#4dff9e'; ctx.arc(c.x, c.y, c.r, 0, Math.PI*2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = i === 0 ? '#fff' : '#0004'; ctx.stroke();
    if(save.equippedSkin !== 'none' && customImage) {
      ctx.save(); ctx.beginPath(); ctx.arc(c.x, c.y, c.r*0.8, 0, Math.PI*2); ctx.clip(); ctx.drawImage(customImage, c.x-c.r*0.8, c.y-c.r*0.8, c.r*1.6, c.r*1.6); ctx.restore();
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(currentAccount, c.x, c.y - c.r - 10);
  });
  ctx.restore();
}

function loop(t) { const dt = Math.min(0.05, (t - lastTime)/1000 || 0); lastTime = t; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

const joyEl = document.getElementById('joystick'), joyKnob = document.getElementById('joyKnob');
joyEl.addEventListener('pointerdown', e => { joy.active = true; joyEl.setPointerCapture(e.pointerId); moveJoy(e.clientX, e.clientY); });
joyEl.addEventListener('pointermove', e => { if(joy.active) moveJoy(e.clientX, e.clientY); });
joyEl.addEventListener('pointerup', () => { joy.active = false; joy.x = 0; joy.y = 0; joyKnob.style.transform = 'translate(-50%,-50%)'; });
function moveJoy(cx, cy) { const rect = joyEl.getBoundingClientRect(); let dx = cx - (rect.left + rect.width/2), dy = cy - (rect.top + rect.height/2); const max = rect.width/2, l = Math.hypot(dx,dy); if(l > max) { dx = dx/l*max; dy = dy/l*max; } joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; joy.x = dx/max; joy.y = dy/max; }

document.getElementById('splitBtn').onclick = doSplit;
document.getElementById('potionBtn').onclick = () => { if(myCells.length > 1) { let newR = Math.sqrt(myCells.reduce((acc, c) => acc + c.r*c.r, 0)); myCells = [{x: myCells[0].x, y: myCells[0].y, r: newR}]; alert("Poção de Cola usada!"); } };

function resize() { const dpr = window.devicePixelRatio||1; W = window.innerWidth; H = window.innerHeight; canvas.width = W*dpr; canvas.height = H*dpr; canvas.style.width = W+'px'; canvas.style.height = H+'px'; ctx.scale(dpr,dpr); }
window.addEventListener('resize', resize); resize();
showScreen('auth');
</script>
